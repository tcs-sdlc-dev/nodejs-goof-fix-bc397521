version: "2"
services:
  goof:
    build: .
    container_name: goof
    environment:
      - DOCKER=1
    ports:
      - "3001:3001"
      - "9229:9229"
    links:
      - goof-mongo
    depends_on:
      - goof-mongo
  goof-mongo:
    container_name: goof-mongo
    image: mongo:7
    ports:
      - "27017:27017"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    volumes:
      - mongo-data:/data/db
      - mongo-configdb:/data/configdb
    tmpfs:
      - /tmp
      - /var/run/mongodb

  good-mysql:
    container_name: goof-mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: acme
    ports:
      - "3306:3306"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    volumes:
      - mysql-data:/var/lib/mysql
    tmpfs:
      - /tmp
      - /var/run/mysqld

volumes:
  mongo-data:
  mongo-configdb:
  mysql-data:
